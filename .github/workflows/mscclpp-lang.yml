name: MSCCLPPLang

on:
  pull_request:
    branches:
      - main
      - release/*

jobs:
  compare-diffs:
    runs-on: 'ubuntu-latest'
    container:
      image: ghcr.io/microsoft/mscclpp/mscclpp:base-dev-${{ matrix.version }}

    strategy:
        fail-fast: false
        matrix:
          version: [ 'cuda12.9', 'cuda13.0' ]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set environment variable
      # CPU runners need the image's driver library to import the native bindings.
      run: echo "LD_LIBRARY_PATH=/usr/local/cuda/compat:/usr/local/cuda/lib64" >> "$GITHUB_ENV"

    - name: Install mscclpp
      run: |
        CMAKE_ARGS="-DMSCCLPP_BYPASS_GPU_CHECK=ON -DMSCCLPP_USE_CUDA=ON" pip3 install .

    - name: Check synchronization diagnostic scenarios
      # Importing the DSL loads the native bindings, which link NVML. CPU runners
      # have no driver NVML, so resolve it against the toolkit's link stub.
      run: |
        stub_dir="$RUNNER_TEMP/nvml-stub"
        mkdir -p "$stub_dir"
        test -f /usr/local/cuda/lib64/stubs/libnvidia-ml.so
        ln -sf /usr/local/cuda/lib64/stubs/libnvidia-ml.so "$stub_dir/libnvidia-ml.so.1"
        LD_LIBRARY_PATH="$stub_dir:$LD_LIBRARY_PATH" python3 python/mscclpp/language/tests/synchronization_scenarios.py

