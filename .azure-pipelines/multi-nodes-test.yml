trigger:
  branches:
    include:
    - main
    - release/*
  paths:
    exclude:
    - .devcontainer/**
    - .github/**
    - docker/**
    - docs/**
    - '**/*.md'

# Do not run multi-nodes-test for PR, we can trigger it manually
pr: none

parameters:
- name: vmssName
  type: string
  default: ''   # unused on pilot (StartVMSS gated off); kept only to satisfy deploy.yml
- name: hostEntries
  type: string
  default: |
    10.0.5.145 DSM121082302011
    10.0.5.150 DSM121082302014
    10.0.5.177 DSM121082301013
    10.0.5.225 DSM121082301032

variables:
  - group: mscclpp

jobs:
- job: MultiNodesTest
  displayName: Multi nodes test
  strategy:
    matrix:
      cuda13:
        containerImage: ghcr.io/microsoft/mscclpp/mscclpp:base-dev-cuda13.0-aarch64
  pool:
    name: msccl-ci-gb200
  container:
    image: $[ variables['containerImage'] ]

  steps:
  - task: Bash@3
    displayName: Node connectivity check
    inputs:
      targetType: 'inline'
      script: |
        set -x
        echo "Agent egress IP:"; curl -s -m 5 ifconfig.me; echo
        while IFS= read -r line; do
          ip=$(awk 'NF>=1{print $1}' <<< "$line")
          [ -z "$ip" ] && continue
          timeout 10 bash -c "cat < /dev/null > /dev/tcp/${ip}/22" \
            && echo "${ip}:22 OPEN" || echo "${ip}:22 UNREACHABLE"
        done <<< "${{ parameters.hostEntries }}"

  - task: Bash@3
    displayName: Add HostEntry
    inputs:
      targetType: 'inline'
      script: |
        while IFS= read -r line; do
          [ -z "$line" ] && continue
          if ! grep -qxF "$line" /etc/hosts; then
            echo "Adding to /etc/hosts: $line"
            echo "$line" | sudo tee -a /etc/hosts
          else
            echo "Entry already exists: $line"
          fi
        done <<< "${{ parameters.hostEntries }}"

  - task: Bash@3
    displayName: Generate deploy files
    inputs:
      targetType: 'inline'
      script: |
        set -e
        DEPLOY_DIR="$(System.DefaultWorkingDirectory)/test/deploy"
        # First NVLink pair (2 nodes) from hostEntries; use $2 (the DSM hostname).
        # Bump to more nodes later by parsing further lines the same way.
        NODE0=$(awk 'NF>=2{print $2; exit}'           <<< "${{ parameters.hostEntries }}")
        NODE1=$(awk 'NF>=2{c++} c==2{print $2; exit}' <<< "${{ parameters.hostEntries }}")

        echo "Host ${NODE0}
          Port 22345
          IdentityFile /root/mscclpp/sshkey
          StrictHostKeyChecking no
        Host ${NODE1}
          Port 22345
          IdentityFile /root/mscclpp/sshkey
          StrictHostKeyChecking no" > "${DEPLOY_DIR}/config"

        printf '%s\n%s\n' "azhpcuser@${NODE0}" "azhpcuser@${NODE1}" > "${DEPLOY_DIR}/hostfile"

        printf '%s\n%s\n' "${NODE0}" "${NODE1}" > "${DEPLOY_DIR}/hostfile_mpi"

        # Publish the head node so the run steps can target it without hardcoding.
        echo "##vso[task.setvariable variable=headNode]${NODE0}"

  - template: templates/deploy.yml
    parameters:
      subscription: mscclpp-ci-h100
      vmssName: ${{ parameters.vmssName }}
      pilot: true
      resourceGroup: mscclpp
      gpuArch: '100a'

  - template: templates/run-remote-task.yml
    parameters:
      name: RunMscclppTest
      displayName: Run multi-nodes mscclpp-test
      continueOnError: true
      runRemoteArgs: '--hostfile $(System.DefaultWorkingDirectory)/test/deploy/hostfile --host $(headNode) --user azhpcuser'
      remoteScript: |
        bash /root/mscclpp/test/deploy/run_tests.sh mscclpp-test

  - template: templates/run-remote-task.yml
    parameters:
      name: RunMultiNodeUnitTest
      displayName: Run multi-nodes unit tests
      runRemoteArgs: '--hostfile $(System.DefaultWorkingDirectory)/test/deploy/hostfile --host $(headNode) --user azhpcuser'
      remoteScript: |
        bash /root/mscclpp/test/deploy/run_tests.sh mp-ut

  - template: templates/run-remote-task.yml
    parameters:
      name: RunMultiNodePythonTests
      displayName: Run multi-nodes python tests
      runRemoteArgs: '--hostfile $(System.DefaultWorkingDirectory)/test/deploy/hostfile --host $(headNode) --user azhpcuser'
      remoteScript: |
        bash /root/mscclpp/test/deploy/run_tests.sh pytests

  - template: templates/run-remote-task.yml
    parameters:
      name: RunMultiNodePythonBenchmark
      displayName: Run multi-nodes python benchmark
      runRemoteArgs: '--hostfile $(System.DefaultWorkingDirectory)/test/deploy/hostfile --host $(headNode) --user azhpcuser'
      remoteScript: |
        bash /root/mscclpp/test/deploy/run_tests.sh py-benchmark
