trigger:
  branches:
    include:
    - main
    - release/*
  paths:
    exclude:
    - .devcontainer/**
    - .github/**
    - docker/**
    - docs/**
    - '**/*.md'

# Do not run multi-nodes-test for PR, we can trigger it manually
pr: none

parameters:
- name: vmssName
  type: string
  default: mscclpp-h100-multinode-ci
- name: hostEntries
  type: string
  default: |
    10.0.0.5 mscclpp-h100-multinode-ci000000
    10.0.0.4 mscclpp-h100-multinode-ci000001

jobs:
- job: MultiNodesTest
  displayName: Multi nodes test
  strategy:
    matrix:
      cuda12:
        containerImage: ghcr.io/microsoft/mscclpp/mscclpp:base-dev-cuda12.9
      cuda13:
        containerImage: ghcr.io/microsoft/mscclpp/mscclpp:base-dev-cuda13.0
  pool:
    name: mscclpp-multi-node
  container:
    image: $[ variables['containerImage'] ]

  steps:
  - task: Bash@3
    displayName: Add HostEntry
    inputs:
      targetType: 'inline'
      script: |
        while IFS= read -r line; do
          [ -z "$line" ] && continue
          if ! grep -qxF "$line" /etc/hosts; then
            echo "Adding to /etc/hosts: $line"
            echo "$line" | sudo tee -a /etc/hosts
          else
            echo "Entry already exists: $line"
          fi
        done <<< "${{ parameters.hostEntries }}"

  - task: Bash@3
    displayName: Generate deploy files
    inputs:
      targetType: 'inline'
      script: |
        set -e
        VMSS="${{ parameters.vmssName }}"
        DEPLOY_DIR="$(System.DefaultWorkingDirectory)/test/deploy"
        NODE0="${VMSS}000000"
        NODE1="${VMSS}000001"

        echo "Host ${NODE0}
          Port 22345
          IdentityFile /root/mscclpp/sshkey
          StrictHostKeyChecking no
        Host ${NODE1}
          Port 22345
          IdentityFile /root/mscclpp/sshkey
          StrictHostKeyChecking no" > "${DEPLOY_DIR}/config"

        printf '%s\n%s\n' "azureuser@${NODE0}" "azureuser@${NODE1}" > "${DEPLOY_DIR}/hostfile"

        printf '%s\n%s\n' "${NODE0}" "${NODE1}" > "${DEPLOY_DIR}/hostfile_mpi"

  - template: templates/deploy.yml
    parameters:
      subscription: mscclpp-ci-h100
      vmssName: ${{ parameters.vmssName }}
      resourceGroup: mscclpp
      gpuArch: '90'

# REPLACE THIS FUNCITON START
  # - template: templates/run-remote-task.yml
  #   parameters:
  #     name: RunMscclppTest
  #     displayName: Run multi-nodes mscclpp-test
  #     continueOnError: true
  #     runRemoteArgs: '--hostfile $(System.DefaultWorkingDirectory)/test/deploy/hostfile --host ${{ parameters.vmssName }}000000 --user azureuser'
  #     remoteScript: |
  #       bash /root/mscclpp/test/deploy/run_tests.sh mscclpp-test
# REPLACE THIS FUNCITON END

  - template: templates/run-remote-task.yml
    parameters:
      name: RunAllreduceTest
      displayName: Run multi-nodes allreduce test
      continueOnError: true
      runRemoteArgs: '--hostfile $(System.DefaultWorkingDirectory)/test/deploy/hostfile --host ${{ parameters.vmssName }}000000 --user azureuser'
      remoteScript: |
        set -e
        # Home is not shared across nodes, so generate the plan once on every node.
        mpirun --allow-run-as-root --bind-to numa -hostfile /root/mscclpp/test/deploy/hostfile_mpi \
          -mca btl_tcp_if_include eth0 -np 2 -npernode 1 \
          -x MSCCLPP_DEBUG=WARN -x MSCCLPP_SOCKET_IFNAME=eth0 -x MSCCLPP_HOME=/root/mscclpp \
          -x LD_LIBRARY_PATH=/root/mscclpp/build/lib:$LD_LIBRARY_PATH -x PATH=$PATH \
          bash -c "mkdir -p /root/mscclpp/dsl_plans && \
            python3 /root/mscclpp/python/mscclpp/default_algos/allreduce_multi_nodes.py \
              --name allreduce_2nodes_1K_64K --num_gpus 16 --gpus_per_node 8 --tbg 1 \
              --min_message_size 1024 --max_message_size 65536 \
              > /root/mscclpp/dsl_plans/allreduce_2nodes_1K_64K.json"
        for SIZE in 1K 16K 64K; do
          mpirun --allow-run-as-root --bind-to numa -hostfile /root/mscclpp/test/deploy/hostfile_mpi \
            -mca btl_tcp_if_include eth0 -np 16 -npernode 8 \
            -x MSCCLPP_DEBUG=WARN -x MSCCLPP_SOCKET_IFNAME=eth0 -x MSCCLPP_HOME=/root/mscclpp \
            -x LD_LIBRARY_PATH=/root/mscclpp/build/lib:$LD_LIBRARY_PATH -x PATH=$PATH \
            python3 /root/mscclpp/python/test/executor_test.py \
              --execution_plan_path /root/mscclpp/dsl_plans/allreduce_2nodes_1K_64K.json \
              --size ${SIZE} --dtype float16 --in_place
        done

  - template: templates/run-remote-task.yml
    parameters:
      name: RunAllgatherTest
      displayName: Run multi-nodes allgather test
      continueOnError: true
      runRemoteArgs: '--hostfile $(System.DefaultWorkingDirectory)/test/deploy/hostfile --host ${{ parameters.vmssName }}000000 --user azureuser'
      remoteScript: |
        set -e
        # Home is not shared across nodes, so generate the plan once on every node.
        mpirun --allow-run-as-root --bind-to numa -hostfile /root/mscclpp/test/deploy/hostfile_mpi \
          -mca btl_tcp_if_include eth0 -np 2 -npernode 1 \
          -x MSCCLPP_DEBUG=WARN -x MSCCLPP_SOCKET_IFNAME=eth0 -x MSCCLPP_HOME=/root/mscclpp \
          -x LD_LIBRARY_PATH=/root/mscclpp/build/lib:$LD_LIBRARY_PATH -x PATH=$PATH \
          bash -c "mkdir -p /root/mscclpp/dsl_plans && \
            python3 /root/mscclpp/python/mscclpp/default_algos/allgather_multi_nodes.py \
              --name allgather_2nodes_1K_8M --num_gpus 16 --gpus_per_node 8 --no-in_place \
              --min_message_size 1024 --max_message_size 8388608 \
              > /root/mscclpp/dsl_plans/allgather_2nodes_1K_8M.json"
        for SIZE in 1K 64K 1M; do
          mpirun --allow-run-as-root --bind-to numa -hostfile /root/mscclpp/test/deploy/hostfile_mpi \
            -mca btl_tcp_if_include eth0 -np 16 -npernode 8 \
            -x MSCCLPP_DEBUG=WARN -x MSCCLPP_SOCKET_IFNAME=eth0 -x MSCCLPP_HOME=/root/mscclpp \
            -x LD_LIBRARY_PATH=/root/mscclpp/build/lib:$LD_LIBRARY_PATH -x PATH=$PATH \
            python3 /root/mscclpp/python/test/executor_test.py \
              --execution_plan_path /root/mscclpp/dsl_plans/allgather_2nodes_1K_8M.json \
              --size ${SIZE} --dtype float16
        done

  - template: templates/run-remote-task.yml
    parameters:
      name: RunReduceScatterTest
      displayName: Run multi-nodes reducescatter test
      continueOnError: true
      runRemoteArgs: '--hostfile $(System.DefaultWorkingDirectory)/test/deploy/hostfile --host ${{ parameters.vmssName }}000000 --user azureuser'
      remoteScript: |
        set -e
        # Home is not shared across nodes, so generate the plan once on every node.
        mpirun --allow-run-as-root --bind-to numa -hostfile /root/mscclpp/test/deploy/hostfile_mpi \
          -mca btl_tcp_if_include eth0 -np 2 -npernode 1 \
          -x MSCCLPP_DEBUG=WARN -x MSCCLPP_SOCKET_IFNAME=eth0 -x MSCCLPP_HOME=/root/mscclpp \
          -x LD_LIBRARY_PATH=/root/mscclpp/build/lib:$LD_LIBRARY_PATH -x PATH=$PATH \
          bash -c "mkdir -p /root/mscclpp/dsl_plans && \
            python3 /root/mscclpp/python/mscclpp/default_algos/reducescatter_multi_nodes.py \
              --name reducescatter_2nodes_1K_64K --num_gpus 16 --gpus_per_node 8 --tbg 1 \
              --min_message_size 1024 --max_message_size 65536 \
              > /root/mscclpp/dsl_plans/reducescatter_2nodes_1K_64K.json"
        for SIZE in 1K 16K 64K; do
          mpirun --allow-run-as-root --bind-to numa -hostfile /root/mscclpp/test/deploy/hostfile_mpi \
            -mca btl_tcp_if_include eth0 -np 16 -npernode 8 \
            -x MSCCLPP_DEBUG=WARN -x MSCCLPP_SOCKET_IFNAME=eth0 -x MSCCLPP_HOME=/root/mscclpp \
            -x LD_LIBRARY_PATH=/root/mscclpp/build/lib:$LD_LIBRARY_PATH -x PATH=$PATH \
            python3 /root/mscclpp/python/test/executor_test.py \
              --execution_plan_path /root/mscclpp/dsl_plans/reducescatter_2nodes_1K_64K.json \
              --size ${SIZE} --dtype float16 --in_place
        done

  - template: templates/run-remote-task.yml
    parameters:
      name: RunMultiNodeUnitTest
      displayName: Run multi-nodes unit tests
      runRemoteArgs: '--hostfile $(System.DefaultWorkingDirectory)/test/deploy/hostfile --host ${{ parameters.vmssName }}000000 --user azureuser'
      remoteScript: |
        bash /root/mscclpp/test/deploy/run_tests.sh mp-ut

  - template: templates/run-remote-task.yml
    parameters:
      name: RunMultiNodePythonTests
      displayName: Run multi-nodes python tests
      runRemoteArgs: '--hostfile $(System.DefaultWorkingDirectory)/test/deploy/hostfile --host ${{ parameters.vmssName }}000000 --user azureuser'
      remoteScript: |
        bash /root/mscclpp/test/deploy/run_tests.sh pytests

  - template: templates/run-remote-task.yml
    parameters:
      name: RunMultiNodePythonBenchmark
      displayName: Run multi-nodes python benchmark
      runRemoteArgs: '--hostfile $(System.DefaultWorkingDirectory)/test/deploy/hostfile --host ${{ parameters.vmssName }}000000 --user azureuser'
      remoteScript: |
        bash /root/mscclpp/test/deploy/run_tests.sh py-benchmark

  - template: templates/stop.yml
    parameters:
      subscription: mscclpp-ci-h100
      vmssName: ${{ parameters.vmssName }}
      resourceGroup: mscclpp
