# =============================================================================
# SGLang single-node test template.
#
# Runs on the pipeline agent and dispatches remote steps to a single VMSS GPU
# node (via run-remote-task.yml). SGLang and its CUDA dependencies are supplied
# by the selected container image. Steps:
#   1. Deploy: build the test container and bring the VMSS node online.
#   2. Build and install MSCCL++ on the node.
#   3. Run sglang.bench_one_batch at several batch sizes.
#   4. Run the MSCCL++ all-reduce micro-benchmark via torchrun.
#   5. Stop / deallocate the VMSS node.
# =============================================================================

parameters:
- name: subscription
  type: string
- name: vmssName
  type: string
- name: gpuArch
  type: string
- name: containerName
  type: string
  default: 'sglang-mscclpp-test'
- name: sglangImage
  type: string
  default: 'lmsysorg/sglang:latest'

steps:
# deployArgs positional fields: <test-mode> <use-gpu> <cuda|rocm>
- template: deploy.yml
  parameters:
    subscription: ${{ parameters.subscription }}
    vmssName: ${{ parameters.vmssName }}
    gpuArch: ${{ parameters.gpuArch }}
    deployArgs: 'single-node-test true cuda'
    containerName: ${{ parameters.containerName }}
    sglangImage: ${{ parameters.sglangImage }}

- template: run-remote-task.yml
  parameters:
    name: RunSGLangBenchOneBatch
    displayName: Run SGLang Bench One Batch
    runRemoteArgs: '--container ${{ parameters.containerName }}'
    remoteScript: |
      export FLASHINFER_DISABLE_VERSION_CHECK=1
      cd /sgl-workspace/sglang/python
      python -m sglang.bench_one_batch --model-path Qwen/Qwen3-8B --batch-size 1 2 4 8 16 32 64 128 256 512 --input-len 256 --output-len 256 --tp-size 8 --enable-mscclpp

- template: run-remote-task.yml
  parameters:
    name: RunSGLangTestAllReduce
    displayName: Run SGLang Test All Reduce
    runRemoteArgs: '--container ${{ parameters.containerName }}'
    remoteScript: |
      export FLASHINFER_DISABLE_VERSION_CHECK=1
      export NODE_SIZE=1
      export WORLD_SIZE=8
      export RANK=0

      cd /sgl-workspace/sglang

      torchrun --nproc_per_node $WORLD_SIZE \
      --nnodes $NODE_SIZE \
      --node_rank $RANK \
      benchmark/kernels/all_reduce/benchmark_mscclpp.py

- template: stop.yml
  parameters:
    subscription: ${{ parameters.subscription }}
    vmssName: ${{ parameters.vmssName }}
