models:
  small:
    d_model: 4096
    num_experts: 8
    top_k: 2
    intermediate_size: 14336
    activation: swiglu
  medium:
    d_model: 5120
    num_experts: 32
    top_k: 4
    intermediate_size: 8192
    activation: swiglu
  large:
    d_model: 7168
    num_experts: 128
    top_k: 8
    intermediate_size: 2048
    activation: swiglu

  scaled_small:
    d_model: 4096
    num_experts: 8
    top_k: 2
    intermediate_size: 8192
    activation: swiglu
  scaled_medium:
    d_model: 5120
    num_experts: 32
    top_k: 2
    intermediate_size: 14336
    activation: swiglu
  scaled_large:
    d_model: 7168
    num_experts: 128
    top_k: 2
    intermediate_size: 20480
    activation: swiglu

inputs:
  decode:
    tokens_per_rank: 16
    dtype: bf16
  prefill:
    tokens_per_rank: 1024
    dtype: bf16

environment:
  mode: latency
  layout: expert_major
  communication_backend: mscclpp
  compute_backend: cutlass_flashinfer
  cuda_graph: false

compute:
  activation_dtype: mxfp8
  weight_dtype: mxfp4

routing:
  balanced:
    kind: balanced
  uniform:
    kind: uniform
  hot_pair:
    kind: hot_experts
    expert_ids: [0, 1]
    probability_mass: 0.8
  # Global expert-load profiles adapted from the MegaMoE benchmark.
  zipf:
    kind: zipf
    alpha: 1.2
  zipf_skewed:
    kind: zipf_skewed
    alpha: 1.2
  hot_experts:
    kind: hot_experts
  lognormal:
    kind: lognormal
    sigma: 0.85

benchmark:
  warmup: 10
  iterations: 100
  seed: 42
  output_dir: benchmark_results
